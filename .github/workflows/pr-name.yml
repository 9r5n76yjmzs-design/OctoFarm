name: PR Title
on:
  pull_request:
    types: [opened, edited, reopened, synchronize, ready_for_review]

# This check needs only the event payload. Avoid an API call (and its token
# permission failures) for data GitHub has already delivered to the runner.
permissions: {}

jobs:
  validate-title:
    name: Validate PR Title
    runs-on: ubuntu-latest
    steps:
      - name: Validate Conventional Commit title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        shell: bash
        run: |
          node <<'NODE'
          const allowed = new Set([
            'fix', 'feat', 'refactor', 'perf', 'test', 'breaking',
            'database', 'security', 'removed', 'ci', 'chore'
          ]);
          const title = process.env.PR_TITLE ?? '';
          const match = /^(?<type>[a-z]+)(?:\((?<scope>[a-z][a-z0-9-]*)\))?!?: (?<subject>[^\r\n]+)$/.exec(title);
          if (!match || !allowed.has(match.groups.type) || /^[A-Z]/.test(match.groups.subject)) {
            console.error('Invalid PR title. Use type(scope): lowercase subject or type: lowercase subject.');
            console.error('Allowed types: ' + [...allowed].join(', '));
            process.exitCode = 1;
          } else {
            console.log('PR title conforms to Conventional Commits.');
          }
          NODE
